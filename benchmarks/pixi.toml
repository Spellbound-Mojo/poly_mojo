[workspace]
name = "poly-mojo-benchmarks"
version = "0.1.0"
description = "Benchmarks comparing Poly Mojo with open-source polynomial software"
authors = ["Anatoly Vitold Stankyavichyus <anatolyvitold@outlook.com>"]
license = "Apache-2.0"
channels = ["conda-forge"]
# Only the recorded benchmark host's platform is pinned for now.
platforms = ["linux-64"]

# Poly Mojo itself is built and compiled with the repository's own workspace
# (../pixi.toml), so its toolchain stays the one the library is tested with.
# This workspace holds the competitors and the harness.

[tasks]
poly-build = { cmd = "pixi run --manifest-path ../pixi.toml --locked build", description = "Build the Poly Mojo packages the drivers import" }
msolve-build = { cmd = "python harness/build_msolve.py", description = "Build the pinned msolve release from source" }
generate = { cmd = "python -m harness.generate", description = "Write the case files" }
bench = { cmd = "python -m harness.run", description = "Run benchmark cases and append raw records" }
report = { cmd = "python -m harness.report", description = "Check answers and write the report" }
test = { cmd = "python -m unittest discover -s harness -t . -p 'test_*.py'", description = "Check the harness itself" }

[dependencies]
python = "3.13.*"
sympy = "==1.14.0"
gmpy2 = ">=2.2"
singular = "==4.4.1"
matplotlib-base = ">=3.9"
# msolve build requirements
c-compiler = "*"
make = "*"
autoconf = "*"
automake = "*"
libtool = "*"
pkg-config = "*"
gmp = "*"
mpfr = "*"
libflint = "*"

[pypi-dependencies]
# The wheel bundles its own FLINT build (3.6.0 for this release).
python-flint = "==0.9.0"
